    </path>
    <path d="M70 -60 C72 -50 76 -46 86 -44 C76 -42 72 -38 70 -28 C68 -38 64 -42 54 -44 C64 -46 68 -50 70 -60 Z" fill="#e0f2fe" opacity="0.9"/>
    <path d="M-62 46 C-61 52 -58 55 -52 56 C-58 57 -61 60 -62 66 C-63 60 -66 57 -72 56 C-66 55 -63 52 -62 46 Z" fill="#e0f2fe" opacity="0.7"/>
