<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="404" viewBox="0 0 1200 404" role="img" aria-label="ZOU Athletics: Diseñé, construí y desplegué solo una plataforma de comercio electrónico para una tienda de ropa deportiva: tienda en línea, panel de administración, API REST con arquitectura limpia e inventario con movimientos auditables. Tiene más de 287 pruebas automatizadas, CI con GitHub Actions y está desplegada en Vercel, Render y Neon bajo un dominio propio.">
<defs>
