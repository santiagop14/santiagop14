<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="383" viewBox="0 0 1200 383" role="img" aria-label="The Nexus Battles VI: Trabajé como desarrollador en un equipo de más de 20 estudiantes bajo el marco Scrum, en el que entregamos por sprints una plataforma de videojuego con arquitectura de microservicios desplegada en AWS (Proyecto Integrador II, UPB). Participé en historias de usuario del backend, pruebas, revisión de código y CI/CD.">
