<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="479" viewBox="0 0 1200 479" role="img" aria-label="Sobre mí: Soy estudiante de sexto semestre de Ingeniería de Sistemas e Informática en la UPB Bucaramanga. Me gusta construir software real: que se despliegue, que tenga pruebas y que alguien lo use. Desarrollé solo ZOU Athletics, un e-commerce full-stack en producción con React, TypeScript, Node.js y PostgreSQL, y trabajé en equipo con Scrum en una plataforma de microservicios con Java y Spring Boot. Me enfoco en buenas prácticas: arquitectura limpia, pruebas automatizadas, revisión de código y CI/CD. Uso herramientas de IA como apoyo, sin dejar de lado el criterio técnico. Fuera del código me encanta el baloncesto, soy hincha del Atlético Bucaramanga y me interesa mucho el mundo de la inteligencia artificial.">
<defs>
<linearGradient id="bgab" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#050914"/><stop offset="54%" stop-color="#081421"/><stop offset="100%" stop-color="#102238"/></linearGradient>
<linearGradient id="edgeab" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="48%" stop-color="#2dd4bf"/><stop offset="78%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="scanab" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/><stop offset="50%" stop-color="#22d3ee" stop-opacity="0.10"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<pattern id="gridab" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#27415e" stroke-width="1" opacity="0.34"/></pattern>
<clipPath id="clipab"><rect width="1200" height="479" rx="20"/></clipPath>
<filter id="glowab" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="479" rx="20" fill="url(#bgab)"/>
