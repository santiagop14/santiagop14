<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Canales de contacto">
<defs>
<linearGradient id="bgcn" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#050914"/><stop offset="54%" stop-color="#081421"/><stop offset="100%" stop-color="#102238"/></linearGradient>
<linearGradient id="edgecn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="48%" stop-color="#2dd4bf"/><stop offset="78%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="scancn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/><stop offset="50%" stop-color="#22d3ee" stop-opacity="0.10"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<pattern id="gridcn" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#27415e" stroke-width="1" opacity="0.34"/></pattern>
<clipPath id="clipcn"><rect width="1200" height="140" rx="20"/></clipPath>
<filter id="glowcn" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="140" rx="20" fill="url(#bgcn)"/>
<rect x="1" y="1" width="1198" height="138" rx="19" fill="url(#gridcn)" opacity="0.2"/>
<rect x="1" y="1" width="1198" height="138" rx="19" fill="none" stroke="#345778" stroke-width="2"/>
<rect x="28" y="24" width="1144" height="92" rx="17" fill="#060d17" fill-opacity="0.64" stroke="#2f648b" stroke-width="1.4"/>
<g clip-path="url(#clipcn)"><rect x="0" y="-72" width="1200" height="72" fill="url(#scancn)"><animateTransform attributeName="transform" type="translate" values="0 0;0 212" dur="11s" repeatCount="indefinite"/></rect></g>
<rect x="28" y="113" width="1144" height="3" rx="1.5" fill="url(#edgecn)" opacity="0.5"/>

<circle cx="52" cy="56" r="4.5" fill="#2dd4bf" filter="url(#glowcn)"><animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/></circle>
<text x="68" y="62" fill="#2dd4bf" font-size="16" font-weight="800" font-family="Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace">CONTACTO // DISPONIBLE</text>
<text x="52" y="88" fill="#8fa3ba" font-size="13" font-family="Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace">santiago@portafolio:~$ open contactos</text>
<text x="1148" y="62" fill="#5f7590" font-size="12" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace">4 CANALES // LISTOS</text>
<line x1="52" y1="105" x2="1148" y2="105" stroke="#315474"/>
