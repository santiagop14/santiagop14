<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Enfoque actual: CONSTRUIR: Aplicaciones web full-stack de punta a punta, del diseño al despliegue. NUBE: Infraestructura y despliegue en AWS (AWS Academy Cloud Foundations). CALIDAD: Pruebas automatizadas, revisión de código y pipelines de CI/CD. IA: Aprender y construir soluciones con inteligencia artificial. CRECER: Trabajo en equipo, nuevos retos y aprendizaje continuo">
