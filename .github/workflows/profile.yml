name: Generar paneles del perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate-profile.mjs"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-panels
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/generate-profile.mjs

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          v="$(cat assets/*.svg | sha256sum | cut -c1-10)"
          perl -pi -e "s#(\./assets/[a-z0-9-]+\.svg)(\?v=[a-z0-9]+)?#\$1?v=${v}#g" README.md
          git add assets README.md
          git commit -m "chore: actualizar paneles del perfil"
          git push
